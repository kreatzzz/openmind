name: Desktop bundle smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-bundles.yml"
      - "bun.lock"
      - "package.json"
      - "scripts/release/**"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

concurrency:
  group: desktop-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: ${{ matrix.name }} development artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            bundles: app,dmg
            artifact: openmind-macos-arm64-development
          - name: Windows x64
            os: windows-2025
            bundles: nsis
            artifact: openmind-windows-x64-development
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.0
      - name: Verify runner architecture
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) test "$(uname -m)" = "arm64" ;;
            Windows) test "$PROCESSOR_ARCHITECTURE" = "AMD64" ;;
          esac
      - run: bun install --frozen-lockfile
      - run: bun run release:verify
      - name: Build development bundles
        run: bun run tauri build --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.ci.conf.json
      - name: Smoke-test macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")" = "io.github.kreatzzz.openmind"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          hdiutil verify "$dmg_path"
          mkdir -p ci-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ci-artifacts/Openmind_macos_arm64_development.app.zip
          cp "$dmg_path" ci-artifacts/Openmind_macos_arm64_development.dmg
      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "Development installer unexpectedly has Authenticode status $($signature.Status)"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "openmind-install-smoke"
          $process = Start-Process $installer.FullName -ArgumentList "/S", "/D=$installRoot" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)" }
          $installedApp = Get-ChildItem $installRoot -Recurse -Filter "openmind.exe" | Select-Object -First 1
          if (-not $installedApp) { throw "Installed Openmind executable was not found" }
          $uninstaller = Get-ChildItem $installRoot -Recurse -Filter "uninstall.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "NSIS uninstaller was not found" }
          $uninstall = Start-Process $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed with exit code $($uninstall.ExitCode)" }
          for ($attempt = 0; $attempt -lt 60 -and (Test-Path $installedApp.FullName); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $installedApp.FullName) { throw "NSIS uninstall left the application executable behind" }
          New-Item -ItemType Directory -Force "ci-artifacts" | Out-Null
          Copy-Item $installer.FullName "ci-artifacts/Openmind_windows_x64_development_setup.exe"
      - name: Write development checksums
        run: bun run release:checksums ci-artifacts
      - name: Upload development bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
